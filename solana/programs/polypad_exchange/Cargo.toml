[package]
name = "polypad_exchange"
version = "0.1.0"
description = "Polypad exchange: signed-quote oracle, pTokens and the USDC float (Solana port of PriceOracle + PExchange)"
edition.workspace = true
rust-version.workspace = true
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "polypad_exchange"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# The cluster byte in every quote message: a quote signed for devnet never
# verifies on mainnet, even under the same program id.
mainnet = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["event-cpi", "init-if-needed"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "solana-v3"] }
solana-sha256-hasher = "3.1.0"
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"

[dev-dependencies]
ed25519-dalek = "2"
litesvm = { version = "0.18.0", features = ["precompiles"] }
solana-account = "4"
solana-clock = "3.2.1"
solana-instruction-error = "2"
solana-keypair = "3.1.2"
solana-message = "4"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-transaction-error = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
