[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "@uniswap/v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

# Stateful fuzzing. `fail_on_revert = false` because the handler deliberately
# drives the contract into states where calls SHOULD revert; the invariants are
# what must never break regardless of which calls landed.
[invariant]
runs = 256
depth = 64
fail_on_revert = false
